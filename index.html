<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Kahva ☕️</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    color:white;
    background:
        radial-gradient(circle at 50% 25%,
        #596b9e 0%,
        #303e70 38%,
        #111832 72%,
        #060a18 100%);
}

/* GLAVNI EKRAN */

.screen{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    padding:24px;
}

.content{
    position:relative;
    z-index:5;
    width:100%;
    max-width:520px;
}

/* MJESEC */

.moon{
    position:absolute;
    top:8%;
    right:10%;
    width:68px;
    height:68px;
    border-radius:50%;
    background:#fff3b5;
    box-shadow:
        0 0 20px rgba(255,243,181,.7),
        0 0 55px rgba(255,243,181,.25);
    animation:moonMove 5s ease-in-out infinite;
}

.moon:after{
    content:"";
    position:absolute;
    top:-5px;
    right:-12px;
    width:68px;
    height:68px;
    border-radius:50%;
    background:#18203f;
}

@keyframes moonMove{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

/* ZVIJEZDE */

.star{
    position:absolute;
    font-size:18px;
    opacity:.3;
    animation:
        twinkle 2.5s ease-in-out infinite alternate,
        floatStar 5s ease-in-out infinite;
}

.star:nth-of-type(1){top:13%;left:13%}
.star:nth-of-type(2){top:22%;right:19%;animation-delay:.8s}
.star:nth-of-type(3){top:38%;left:7%;animation-delay:1.4s}
.star:nth-of-type(4){top:42%;right:8%;animation-delay:.4s}
.star:nth-of-type(5){bottom:23%;left:18%;animation-delay:1.7s}
.star:nth-of-type(6){bottom:17%;right:18%;animation-delay:1s}
.star:nth-of-type(7){bottom:32%;left:8%;animation-delay:2s}
.star:nth-of-type(8){bottom:38%;right:7%;animation-delay:.7s}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.25);
    }
}

@keyframes floatStar{
    from{margin-top:0}
    to{margin-top:-8px}
}

/* KAHVA */

.coffee{
    font-size:72px;
    opacity:0;
    animation:
        coffeeIn 1.2s ease .2s forwards,
        coffeeFloat 3s ease-in-out 1.4s infinite;
}

@keyframes coffeeIn{
    0%{
        opacity:0;
        transform:scale(.5) translateY(30px);
    }
    70%{
        opacity:1;
        transform:scale(1.1) translateY(-5px);
    }
    100%{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes coffeeFloat{
    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }
    50%{
        transform:translateY(-10px) rotate(2deg);
    }
}

/* TEKST */

.intro{
    margin-top:10px;
    font-size:17px;
    letter-spacing:1px;
    opacity:0;
    animation:fadeUp 1s ease .5s forwards;
}

h1{
    margin:15px 0 12px;
    font-size:clamp(38px,10vw,56px);
    line-height:1.05;
    opacity:0;
    animation:
        fadeUp 1s ease .8s forwards,
        glow 3s ease-in-out 2s infinite alternate;
}

.question{
    font-size:clamp(22px,5.5vw,29px);
    line-height:1.45;
    margin-bottom:28px;
    opacity:0;
    animation:fadeUp 1s ease 1.2s forwards;
}

/* DUGMAD */

.buttons{
    position:relative;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    opacity:0;
    animation:fadeUp 1s ease 1.6s forwards;
}

button{
    font-family:inherit;
    font-size:19px;
    font-weight:700;
    border:none;
    border-radius:999px;
    padding:14px 30px;
    cursor:pointer;
}

#yesBtn{
    color:#17203d;
    background:#fff3b5;
    box-shadow:0 8px 30px rgba(255,243,181,.25);
}

#yesBtn:active{
    transform:scale(.94);
}

#noBtn{
    position:absolute;
    left:55%;
    color:white;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    transition:left .18s ease,top .18s ease;
}

.bottom{
    margin-top:25px;
    color:rgba(255,255,255,.65);
    font-size:15px;
    opacity:0;
    animation:fadeUp 1s ease 2s forwards;
}

/* IZBOR DANA */

.day-screen{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:45px 20px 30px;

    overflow-y:auto;

    text-align:center;

    background:
        radial-gradient(circle at 50% 15%,
        #596b9e 0%,
        #303e70 38%,
        #111832 72%,
        #060a18 100%);

    animation:screenIn .7s ease forwards;
}

.day-coffee{
    font-size:55px;
    animation:coffeeFloat 3s ease-in-out infinite;
}

.day-title{
    margin:12px 0 8px;
    font-size:clamp(30px,8vw,45px);
    opacity:0;
    animation:fadeUp .8s ease .2s forwards;
}

.day-subtitle{
    margin:0 0 25px;
    color:rgba(255,255,255,.8);
    font-size:18px;
    opacity:0;
    animation:fadeUp .8s ease .5s forwards;
}

.days{
    width:100%;
    max-width:430px;

    display:flex;
    flex-direction:column;
    gap:10px;

    padding-bottom:25px;
}

.day{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 19px;

    color:white;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.15);

    border-radius:18px;

    text-align:left;

    opacity:0;
    transform:translateY(15px);

    animation:dayIn .6s ease forwards;

    transition:transform .2s ease,background .2s ease;
}

.day:active{
    transform:scale(.97);
    background:rgba(255,255,255,.18);
}

.day-name{
    font-size:19px;
    font-weight:600;
}

.day-arrow{
    font-size:24px;
    color:rgba(255,255,255,.65);
}

/* ZAVRŠNI EKRAN */

.final-screen{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:25px;

    background:
        radial-gradient(circle at 50% 25%,
        #596b9e 0%,
        #303e70 38%,
        #111832 72%,
        #060a18 100%);

    animation:screenIn .8s ease forwards;
}

.final-coffee{
    font-size:100px;
    opacity:0;

    animation:
        finalCoffeeIn 1.2s ease .2s forwards,
        coffeeFloat 3s ease-in-out 1.4s infinite;
}

.final-title{
    margin-top:20px;
    font-size:clamp(42px,10vw,60px);
    opacity:0;

    animation:
        fadeUp 1s ease 1s forwards,
        glow 2.5s ease-in-out 2s infinite alternate;
}

.final-text{
    margin-top:20px;
    font-size:22px;
    line-height:1.55;
    opacity:0;
    animation:fadeUp 1s ease 1.7s forwards;
}

.final-sparkles{
    margin-top:30px;
    font-size:26px;
    opacity:0;

    animation:
        fadeUp 1s ease 2.3s forwards,
        sparkle 2s ease-in-out 3.3s infinite alternate;
}

/* ANIMACIJE */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes glow{
    from{
        text-shadow:0 0 5px rgba(255,255,255,.1);
    }
    to{
        text-shadow:
            0 0 10px rgba(255,255,255,.75),
            0 0 30px rgba(255,255,255,.25);
    }
}

@keyframes screenIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes dayIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes finalCoffeeIn{
    from{
        opacity:0;
        transform:scale(.4) translateY(30px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes sparkle{
    from{
        opacity:.35;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1.15);
    }
}

@media(max-width:600px){

    .moon{
        width:56px;
        height:56px;
        top:6%;
        right:8%;
    }

    .moon:after{
        width:56px;
        height:56px;
    }

    .coffee{
        font-size:64px;
    }

    .day-screen{
        padding-top:35px;
    }
}
</style>
</head>

<body>

<div class="screen">

    <div class="moon"></div>

    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>

    <div class="content">

        <div class="coffee">
            ☕️
        </div>

        <div class="intro">
            za sljedeću sedmicu
        </div>

        <h1>
            Sanela 😊
        </h1>

        <div class="question">
            Hoćemo na kahvu<br>
            sljedeće sedmice?
        </div>

        <div class="buttons">

            <button id="yesBtn">
                DA ☕️
            </button>

            <button id="noBtn">
                NE 🙈
            </button>

        </div>

        <div class="bottom">
            Mislim da bi bilo lijepo 😊
        </div>

    </div>
</div>


<script>

/* =================================
   FORMSUBMIT
================================= */

const FORM_URL =
"https://formsubmit.co/ajax/a66ce24f7a9cfbac556328b2810dadd5";


/* =================================
   ELEMENTI
================================= */

const yesBtn =
document.getElementById("yesBtn");

const noBtn =
document.getElementById("noBtn");


/* =================================
   NE - BJEŽI
================================= */

function moveNoButton(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    const bw =
        noBtn.offsetWidth;

    const bh =
        noBtn.offsetHeight;

    const padding = 20;

    const x =
        padding +
        Math.random() *
        Math.max(
            1,
            w - bw - padding * 2
        );

    const y =
        padding +
        Math.random() *
        Math.max(
            1,
            h - bh - padding * 2
        );

    noBtn.style.left =
        x + "px";

    noBtn.style.top =
        y + "px";
}


noBtn.addEventListener(
    "mouseenter",
    moveNoButton
);


noBtn.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        moveNoButton();

    },
    {passive:false}
);


noBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        moveNoButton();

    }
);


/* =================================
   DA
================================= */

yesBtn.addEventListener(
    "click",
    function(){

        showDaySelection();

    }
);


/* =================================
   DANI
================================= */

const dayNames = [
    "Subota",
    "Nedjelja",
    "Ponedjeljak",
    "Utorak",
    "Srijeda",
    "Četvrtak",
    "Petak",
    "Subota"
];


/* =================================
   IZBOR DANA
================================= */

function showDaySelection(){

    let daysHTML = "";

    dayNames.forEach(
        function(day,index){

            daysHTML += `

                <button
                    class="day"
                    data-day="${day}"
                    style="
                        animation-delay:
                        ${0.15 + index * 0.08}s
                    "
                >

                    <div class="day-name">
                        ${day}
                    </div>

                    <div class="day-arrow">
                        ›
                    </div>

                </button>

            `;
        }
    );


    document.body.innerHTML = `

        <div class="day-screen">

            <div class="day-coffee">
                ☕️
            </div>

            <div class="day-title">
                Super 😊
            </div>

            <div class="day-subtitle">
                A kada ćemo na kahvu?
            </div>

            <div class="days">
                ${daysHTML}
            </div>

        </div>

    `;


    document
        .querySelectorAll(".day")
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        chooseDay(
                            this.dataset.day
                        );

                    }
                );

            }
        );
}


/* =================================
   IZABRANI DAN
================================= */

async function chooseDay(day){

    /*
       Prvo prikaži završni ekran
       da njoj odmah izgleda lijepo.
    */

    document.body.innerHTML = `

        <div class="final-screen">

            <div class="final-coffee">
                ☕️
            </div>

            <div class="final-title">
                Dogovoreno 😊
            </div>

            <div class="final-text">

                Onda smo se dogovorili
                za<br>

                <strong>
                    ${day}
                </strong>

                ☕️

            </div>

            <div class="final-sparkles">
                ✨　☕️　✨
            </div>

        </div>

    `;


    /*
       Pošalji tebi mail.
    */

    try{

        const formData =
            new FormData();

        formData.append(
            "odgovor",
            "DA"
        );

        formData.append(
            "odabrani_dan",
            day
        );

        formData.append(
            "_subject",
            "☕️ Sanela je izabrala dan"
        );

        formData.append(
            "_captcha",
            "false"
        );


        await fetch(
            FORM_URL,
            {
                method:"POST",

                body:formData,

                headers:{
                    "Accept":
                        "application/json"
                }
            }
        );

    }catch(error){

        console.log(
            "Mail error:",
            error
        );

    }
}

</script>

</body>
</html>
