<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Kahva sa Sanelom ☕</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body {
  color: white;
  background:
    radial-gradient(
      circle at 50% 25%,
      #52648d 0%,
      #303f70 35%,
      #17234b 65%,
      #080d20 100%
    );
}

/* ZVIJEZDE */

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: .5;
  animation: twinkle 2.8s infinite ease-in-out;
}

.star:nth-child(1)  { left: 8%;  top: 15%; animation-delay: .2s; }
.star:nth-child(2)  { left: 18%; top: 32%; animation-delay: 1s; }
.star:nth-child(3)  { left: 27%; top: 12%; animation-delay: 1.5s; }
.star:nth-child(4)  { left: 38%; top: 23%; animation-delay: .7s; }
.star:nth-child(5)  { left: 52%; top: 11%; animation-delay: 1.9s; }
.star:nth-child(6)  { left: 63%; top: 31%; animation-delay: .4s; }
.star:nth-child(7)  { left: 76%; top: 16%; animation-delay: 1.2s; }
.star:nth-child(8)  { left: 88%; top: 27%; animation-delay: .9s; }
.star:nth-child(9)  { left: 13%; top: 55%; animation-delay: 1.7s; }
.star:nth-child(10) { left: 25%; top: 67%; animation-delay: .3s; }
.star:nth-child(11) { left: 73%; top: 62%; animation-delay: 1.4s; }
.star:nth-child(12) { left: 90%; top: 72%; animation-delay: .8s; }
.star:nth-child(13) { left: 45%; top: 76%; animation-delay: 2s; }
.star:nth-child(14) { left: 57%; top: 58%; animation-delay: .6s; }
.star:nth-child(15) { left: 6%;  top: 82%; animation-delay: 1.1s; }

@keyframes twinkle {
  0%, 100% {
    transform: scale(.6);
    opacity: .25;
  }

  50% {
    transform: scale(1.8);
    opacity: 1;
  }
}

/* GLAVNA STRANICA */

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px 20px;
  z-index: 2;
}

.card {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

/* KAHVA */

.coffee {
  font-size: 88px;
  line-height: 1;
  margin-bottom: 20px;

  filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));

  animation:
    coffeeAppear 1.2s ease both,
    coffeeFloat 3s ease-in-out 1.2s infinite;
}

@keyframes coffeeAppear {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.7);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes coffeeFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-9px);
  }
}

/* TEKST */

.small {
  font-size: 17px;
  letter-spacing: 2px;
  opacity: .75;
  margin-bottom: 10px;

  animation: fadeUp .8s ease .2s both;
}

h1 {
  margin: 0;

  font-size: clamp(38px, 10vw, 58px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -1.5px;

  text-shadow:
    0 0 15px rgba(255,255,255,.25);

  animation: fadeUp .9s ease .4s both;
}

.subtitle {
  margin: 18px auto 28px;

  font-size: 21px;
  line-height: 1.45;

  max-width: 400px;

  opacity: .92;

  animation: fadeUp .9s ease .6s both;
}

.question {
  font-size: 17px;
  margin-bottom: 18px;

  opacity: .85;

  animation: fadeUp .8s ease .8s both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(22px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* DANI */

.days {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 12px;

  width: 100%;
  max-width: 430px;

  margin: 0 auto;

  animation:
    fadeUp .8s ease 1s both;
}

.day {
  border: 1px solid rgba(255,255,255,.18);

  background:
    rgba(255,255,255,.10);

  color: white;

  border-radius: 18px;

  padding: 16px 9px;

  font-size: 17px;
  font-weight: 600;

  box-shadow:
    0 8px 25px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.1);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;

  cursor: pointer;
}

.day:hover {
  background:
    rgba(255,255,255,.18);

  transform:
    translateY(-2px);
}

.day:active {
  transform:
    scale(.94);
}

.day.selected {
  background:
    rgba(255,255,255,.28);

  box-shadow:
    0 0 25px rgba(255,255,255,.18),
    0 10px 30px rgba(0,0,0,.25);
}

.day:disabled {
  cursor: default;
}

/* LOADING */

.loading {
  display: none;

  margin-top: 22px;

  font-size: 16px;

  opacity: .75;
}

.loading.show {
  display: block;
}

.loader {
  display: inline-block;

  width: 18px;
  height: 18px;

  border:
    2px solid rgba(255,255,255,.25);

  border-top-color: white;

  border-radius: 50%;

  animation:
    spin .8s linear infinite;

  vertical-align: -4px;

  margin-right: 8px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* REZULTAT */

.result {
  display: none;

  animation:
    resultAppear 1s ease both;
}

.result.show {
  display: block;
}

@keyframes resultAppear {
  from {
    opacity: 0;
    transform: scale(.85);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.result-coffee {
  font-size: 90px;

  margin-bottom: 20px;

  animation:
    resultCoffee 1.3s ease both,
    coffeeFloat 3s ease-in-out 1.3s infinite;
}

@keyframes resultCoffee {
  0% {
    opacity: 0;
    transform:
      scale(.3)
      translateY(50px);
  }

  70% {
    transform:
      scale(1.15);
  }

  100% {
    opacity: 1;
    transform:
      scale(1);
  }
}

.result h2 {
  margin: 0;

  font-size:
    clamp(38px, 10vw, 58px);

  line-height: 1.1;

  text-shadow:
    0 0 20px rgba(255,255,255,.35);

  animation:
    glowText 2.2s ease-in-out infinite alternate;
}

@keyframes glowText {
  from {
    text-shadow:
      0 0 8px rgba(255,255,255,.2);
  }

  to {
    text-shadow:
      0 0 28px rgba(255,255,255,.75),
      0 0 45px rgba(255,220,150,.25);
  }
}

.result p {
  margin:
    20px auto 0;

  font-size: 22px;
  line-height: 1.45;

  max-width: 400px;

  opacity: .92;

  animation:
    fadeUp .9s ease .5s both;
}

.sparkles {
  margin-top: 34px;

  font-size: 30px;

  letter-spacing: 18px;

  animation:
    sparkleAppear 1s ease 1s both,
    sparkleMove 2.5s ease-in-out 1.5s infinite;
}

@keyframes sparkleAppear {
  from {
    opacity: 0;
    transform: scale(.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes sparkleMove {
  0%, 100% {
    opacity: .55;
    transform: translateY(0);
  }

  50% {
    opacity: 1;
    transform: translateY(-5px);
  }
}

/* MOBITEL */

@media (max-width: 420px) {

  .page {
    padding:
      24px 16px;
  }

  .coffee {
    font-size: 74px;
  }

  .subtitle {
    font-size: 19px;
  }

  .question {
    font-size: 16px;
  }

  .day {
    font-size: 15px;
    padding: 15px 7px;
  }

  .result-coffee {
    font-size: 78px;
  }

  .result p {
    font-size: 20px;
  }
}

@media (max-height: 700px) {

  .coffee {
    font-size: 62px;
    margin-bottom: 10px;
  }

  .subtitle {
    margin:
      12px auto 18px;
  }

  .question {
    margin-bottom: 12px;
  }

  .day {
    padding: 11px 7px;
  }
}
</style>
</head>


<body>

<!-- ZVIJEZDE -->

<div class="stars">

  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>
  <span class="star"></span>

</div>


<main class="page">

<div class="card">


<!-- =========================
     GLAVNO PITANJE
========================= -->

<section id="mainContent">

  <div class="coffee">
    ☕
  </div>

  <div class="small">
    nešto jednostavno 😊
  </div>

  <h1>
    Sanela
  </h1>

  <div class="subtitle">
    Hoćemo na kahvu sljedeće sedmice? ☕
  </div>

  <div class="question">
    Samo izaberi koji ti dan najviše odgovara:
  </div>


  <!-- DANI -->

  <div class="days">

    <button
      class="day"
      data-day="Ova subota"
      data-case="subotu">

      Ova subota ☕
    </button>


    <button
      class="day"
      data-day="Nedjelja"
      data-case="nedjelju">

      Nedjelja ☕
    </button>


    <button
      class="day"
      data-day="Ponedjeljak"
      data-case="ponedjeljak">

      Ponedjeljak ☕
    </button>


    <button
      class="day"
      data-day="Utorak"
      data-case="utorak">

      Utorak ☕
    </button>


    <button
      class="day"
      data-day="Srijeda"
      data-case="srijedu">

      Srijeda ☕
    </button>


    <button
      class="day"
      data-day="Četvrtak"
      data-case="četvrtak">

      Četvrtak ☕
    </button>


    <button
      class="day"
      data-day="Petak"
      data-case="petak">

      Petak ☕
    </button>


    <button
      class="day"
      data-day="Sljedeća subota"
      data-case="sljedeću subotu">

      Sljedeća subota ☕
    </button>

  </div>


  <!-- LOADING -->

  <div
    class="loading"
    id="loading">

    <span class="loader"></span>

    Samo trenutak... 😊

  </div>

</section>



<!-- =========================
     ZAVRŠNA PORUKA
========================= -->

<section
  class="result"
  id="result">

  <div class="result-coffee">
    ☕
  </div>


  <h2 id="resultTitle">
    Dogovoreno 😊
  </h2>


  <p id="resultText">
    Vidimo se uskoro ☕
  </p>


  <div class="sparkles">
    ✨ ☕ ✨
  </div>

</section>


</div>

</main>



<script>

/* =====================================
   FORMSUBMIT AJAX
===================================== */

const FORM_ENDPOINT =
  "https://formsubmit.co/ajax/a66ce24f7a9cfbac556328b2810dadd5";


/* =====================================
   ELEMENTI
===================================== */

const buttons =
  document.querySelectorAll(".day");

const mainContent =
  document.getElementById("mainContent");

const result =
  document.getElementById("result");

const resultTitle =
  document.getElementById("resultTitle");

const resultText =
  document.getElementById("resultText");

const loading =
  document.getElementById("loading");


/* =====================================
   KLIK NA DAN
===================================== */

buttons.forEach(button => {

  button.addEventListener(
    "click",
    async function() {

      /* -----------------------------
         UZMI ODABRANI DAN
      ----------------------------- */

      const selectedDay =
        this.dataset.day;

      const selectedCase =
        this.dataset.case;


      /* -----------------------------
         OZNAČI ODABIR
      ----------------------------- */

      buttons.forEach(btn => {

        btn.classList.remove(
          "selected"
        );

      });

      this.classList.add(
        "selected"
      );


      /* -----------------------------
         SPRIJEČI DUPLI KLIK
      ----------------------------- */

      buttons.forEach(btn => {

        btn.disabled = true;

      });


      loading.classList.add(
        "show"
      );


      /* -----------------------------
         POŠALJI MAIL TEBI
      ----------------------------- */

      try {

        const formData =
          new FormData();


        formData.append(
          "odgovor",
          `DA — Hoćemo na kahvu sljedeće sedmice. Odabrala je: ${selectedDay}`
        );


        formData.append(
          "_subject",
          `Sanela je rekla DA ☕ — ${selectedDay}`
        );


        formData.append(
          "_captcha",
          "false"
        );


        formData.append(
          "_template",
          "table"
        );


        await fetch(
          FORM_ENDPOINT,
          {
            method: "POST",

            body: formData,

            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      } catch(error) {

        console.log(
          "FormSubmit:",
          error
        );

      }


      /* -----------------------------
         MALO PRIČEKAJ
      ----------------------------- */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            700
          )
      );


      /* -----------------------------
         SKLONI LOADING
      ----------------------------- */

      loading.classList.remove(
        "show"
      );


      /* -----------------------------
         ZAVRŠNA PORUKA
      ----------------------------- */

      resultTitle.textContent =
        "Dogovoreno 😊";


      resultText.textContent =
        `Vidimo se u ${selectedCase} ☕`;


      /* -----------------------------
         PREĐI NA ZAVRŠNU ANIMACIJU
      ----------------------------- */

      mainContent.style.display =
        "none";


      result.classList.add(
        "show"
      );

    }
  );

});

</script>

</body>
</html>
