<script>
const form = document.querySelector("form");

if (form) {
  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const button = form.querySelector('button[type="submit"]');

    if (button) {
      button.disabled = true;
      button.style.opacity = "0.6";
    }

    try {
      const response = await fetch(
        "https://formsubmit.co/ajax/a66ce24f7a9cfbac556328b2810dadd5",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            odgovor: "DA — Hoćemo na kahvu sljedeće sedmice?",
            _subject: "☕️ Sanela je rekla DA 😊"
          })
        }
      );

      const data = await response.json();

      if (data.success) {
        document.body.innerHTML = `
          <div class="final-screen">

            <div class="stars stars1">✦　✧　✦</div>
            <div class="stars stars2">✧　✦　✧</div>
            <div class="stars stars3">✦　✧</div>

            <div class="coffee">☕️</div>

            <h1>Dogovoreno 😊</h1>

            <p class="line">
              Onda nam samo ostaje<br>
              da izaberemo dan.
            </p>

            <div class="sparkles">✨　☕️　✨</div>

          </div>

          <style>
            .final-screen {
              min-height: 100vh;
              width: 100%;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              text-align: center;
              color: white;
              background:
                radial-gradient(
                  circle at 50% 25%,
                  #596b98 0%,
                  #27345f 38%,
                  #090e25 88%
                );
              font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
              overflow: hidden;
              position: relative;
            }

            .coffee {
              font-size: 92px;
              opacity: 0;
              animation:
                coffeeIn 1.2s ease forwards,
                coffeeFloat 3s ease-in-out 1.2s infinite;
            }

            h1 {
              margin: 22px 0 0;
              font-size: 48px;
              letter-spacing: -1px;
              opacity: 0;
              animation:
                textIn 1s ease 1s forwards,
                glow 2.5s ease-in-out 2s infinite alternate;
            }

            .line {
              margin-top: 22px;
              font-size: 22px;
              line-height: 1.55;
              opacity: 0;
              transform: translateY(15px);
              animation: textIn 1s ease 1.8s forwards;
            }

            .sparkles {
              margin-top: 32px;
              font-size: 23px;
              opacity: 0;
              animation:
                textIn 1s ease 2.5s forwards,
                sparkle 2s ease-in-out 3.5s infinite alternate;
            }

            .stars {
              position: absolute;
              font-size: 22px;
              opacity: 0;
              animation: starAppear 1.5s ease forwards,
                         twinkle 2.5s ease-in-out infinite alternate;
            }

            .stars1 {
              top: 18%;
              left: 18%;
              animation-delay: 1.2s;
            }

            .stars2 {
              top: 27%;
              right: 17%;
              animation-delay: 1.7s;
            }

            .stars3 {
              bottom: 23%;
              left: 25%;
              animation-delay: 2.1s;
            }

            @keyframes coffeeIn {
              0% {
                opacity: 0;
                transform: scale(.5) translateY(25px);
              }

              70% {
                opacity: 1;
                transform: scale(1.12) translateY(-5px);
              }

              100% {
                opacity: 1;
                transform: scale(1) translateY(0);
              }
            }

            @keyframes coffeeFloat {
              0%,100% {
                transform: translateY(0) rotate(-2deg);
              }

              50% {
                transform: translateY(-10px) rotate(2deg);
              }
            }

            @keyframes textIn {
              from {
                opacity: 0;
                transform: translateY(18px);
              }

              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

            @keyframes glow {
              from {
                text-shadow: 0 0 5px rgba(255,255,255,.2);
              }

              to {
                text-shadow:
                  0 0 10px rgba(255,255,255,.8),
                  0 0 25px rgba(255,255,255,.35);
              }
            }

            @keyframes starAppear {
              from {
                opacity: 0;
                transform: scale(.4);
              }

              to {
                opacity: .8;
                transform: scale(1);
              }
            }

            @keyframes twinkle {
              from {
                opacity: .3;
                transform: scale(.85);
              }

              to {
                opacity: 1;
                transform: scale(1.15);
              }
            }

            @keyframes sparkle {
              from {
                opacity: .4;
                transform: scale(.9);
              }

              to {
                opacity: 1;
                transform: scale(1.12);
              }
            }
          </style>
        `;
      }

    } catch (error) {
      console.error(error);

      if (button) {
        button.disabled = false;
        button.style.opacity = "1";
      }
    }
  });
}
</script>
